  let obsBuilt = false, obsPalIdx = -1, obsSlots = [], obsHintTimer = null;

  function obsRotate(pal, k){ k = ((k % 5) + 5) % 5; return pal.slice(k).concat(pal.slice(0, k)); }
  function obsApplyPalette(pal){
    const ov = $('#obs-overlay');
    pal.forEach((c, i) => ov.style.setProperty('--c' + (i + 1), c));
    obsSlots.forEach(slot => {
      obsRotate(pal, slot._k).forEach((c, i) => slot.style.setProperty('--p' + (i + 1), c));
    });
  }
  function obsShiftPalette(){
    let idx;
    do{ idx = Math.floor(Math.random() * PSYCHE_PALETTES.length); }while(idx === obsPalIdx);
    obsPalIdx = idx;
    obsApplyPalette(PSYCHE_PALETTES[idx]);
    const stage = $('#obs-stage');
    stage.classList.remove('shift'); void stage.offsetWidth; stage.classList.add('shift');
  }

  function obsBuild(){
    if(obsBuilt) return;
    if(!CELESTIAL || !CELESTIAL.pieces || !CELESTIAL.pieces.length) throw new Error('artwork data is missing from this copy of the page');
    obsBuilt = true;
    const D = CELESTIAL, stage = $('#obs-stage');
    const byId = {};
    D.pieces.forEach(p => {
      byId[p.id] = p;
      stage.style.setProperty('--m-' + p.id, 'url("data:image/png;base64,' + p.png + '")');
    });
    const originOf = p => ((p.cx - p.x) / p.w * 100).toFixed(2) + '% ' + ((p.cy - p.y) / p.h * 100).toFixed(2) + '%';
    let kCounter = 0;

    // o: { motion:[name, dur, timing, alternate], orbit:[name, dur, radiusPx, reverse], fill, cls, depth, k, tag, delay, still }
    function add(p, o){
      const r = seededRng('obs:' + p.id + ':' + (o.tag || ''));
      const slot = document.createElement('div');
      slot.className = 'cel-slot' + (o.cls ? ' ' + o.cls : '');
      slot.style.left = (p.x / D.W * 100) + '%';
      slot.style.top = (p.y / D.H * 100) + '%';
      slot.style.width = (p.w / D.W * 100) + '%';
      slot.style.height = (p.h / D.H * 100) + '%';
      slot.style.setProperty('--depth', o.depth == null ? 0.5 : o.depth);
      slot._k = o.k == null ? (kCounter++) : o.k;

      const orbit = document.createElement('div');
      orbit.className = 'cel-orbit';
      if(o.orbit){
        const [name, dur, rad, rev] = o.orbit;
        orbit.style.setProperty('--orb-r', 'calc(' + rad + ' * var(--u))');
        orbit.style.animation = name + ' ' + dur.toFixed(2) + 's linear ' + (-(r() * dur)).toFixed(2) + 's infinite' + (rev ? ' reverse' : '');
      }

      const motion = document.createElement('div');
      motion.className = 'cel-motion';
      motion.style.transformOrigin = originOf(p);
      if(o.motion){
        const [name, dur, timing, alt] = o.motion;
        const delay = o.delay != null ? o.delay : -(r() * dur);
        motion.style.animation = name + ' ' + dur.toFixed(2) + 's ' + (timing || 'linear') + ' ' + delay.toFixed(2) + 's infinite' + (alt ? ' alternate' : '');
      }

      const art = document.createElement('div');
      art.className = 'cel-art f-' + (o.fill || 'conic') + (o.still ? ' still' : '');
      art.style.setProperty('--m', 'var(--m-' + p.id + ')');
      const o2 = originOf(p).split(' ');
      art.style.setProperty('--ox', o2[0]);
      art.style.setProperty('--oy', o2[1]);
      const fd = 9 + r() * 14;
      art.style.setProperty('--fd', fd.toFixed(1) + 's');
      art.style.animationDelay = (-(r() * fd)).toFixed(1) + 's';
      if(r() < 0.5) art.style.animationDirection = 'reverse';

      motion.appendChild(art); orbit.appendChild(motion); slot.appendChild(orbit);
      stage.appendChild(slot);
      obsSlots.push(slot);
    }

    // Named pieces go through A() so one missing piece can never break the whole room.
    const A = (id, o) => { if(byId[id]) add(byId[id], o); };

    // ---- the big sun: tunnel of echoes, two ghost layers, and the sun itself
    const sun = byId.sun;
    for(let i = 0; i < 4; i++){
      add(sun, { cls:'echo', fill:'conic', still:true, depth:0.15, k:i + 1, tag:'e' + i,
        motion:['cel-echo', 12, 'cubic-bezier(.5,.05,.9,.55)', false], delay:-(i * 12 / 4) });
    }
    add(sun, { cls:'ghost', fill:'conic', still:true, depth:0.4, k:2, tag:'g1', motion:['cel-spin-rev', 38, 'linear', false] });
    add(sun, { cls:'ghost', fill:'conic', still:true, depth:0.3, k:3, tag:'g2', motion:['cel-spiral', 30, 'ease-in-out', false] });
    add(sun, { fill:'ripple', depth:0.6, k:0, tag:'main', motion:['cel-spin', 90, 'linear', false], orbit:['cel-pulse', 5, 0, false] });
    // cel-pulse animates scale, not translate, so give it its own tiny override
    obsSlots[obsSlots.length - 1].querySelector('.cel-orbit').style.animation = 'cel-pulse 5s ease-in-out infinite alternate';

    // ---- crescent + its rays: every ray spins around the crescent's centre, each its own way
    A('crescent', { fill:'conic', depth:1, motion:['cel-flip', 7, 'ease-in-out', false] });
    const ang = p => Math.atan2((p.y + p.h / 2) - p.cy, (p.x + p.w / 2) - p.cx);
    const rays = D.pieces.filter(p => p.kind === 'ray').sort((a, b) => ang(a) - ang(b));
    rays.forEach((p, j) => {
      const r = seededRng('obsr:' + p.id);
      let m;
      switch(j % 6){
        case 0: m = ['cel-spin', 20 + r() * 22, 'linear', false]; break;
        case 1: m = ['cel-swing', 3 + r() * 3, 'ease-in-out', true]; break;
        case 2: m = ['cel-spin-rev', 26 + r() * 30, 'linear', false]; break;
        case 3: m = ['cel-breathe', 2.4 + r() * 2, 'ease-in-out', true]; break;
        case 4: m = ['cel-spin', 8 + r() * 6, 'steps(12)', false]; break;
        default: m = ['cel-spiral', 10 + r() * 8, 'ease-in-out', false];
      }
      add(p, { fill:'conic', depth:0.35, motion:m, cls:'ray' });
    });

    // ---- the little sun with a moon in it: disc and rays counter-rotate
    A('smallrays', { fill:'conic', depth:0.7, motion:['cel-spin-rev', 14, 'steps(14)', false] });
    A('smalldisc', { fill:'conic', depth:0.8, motion:['cel-spin', 5.5, 'linear', false] });

    // ---- stars and starbursts
    A('star8', { fill:'conic', depth:0.9, motion:['cel-spiral', 9, 'ease-in-out', false], orbit:['cel-orbit', 8, 12, false] });
    A('star4_41', { fill:'conic', depth:0.9, motion:['cel-flip', 5.2, 'ease-in-out', false] });
    A('star4_52', { fill:'conic', depth:0.9, motion:['cel-wobble', 3.4, 'ease-in-out', true] });
    A('burst', { fill:'conic', depth:0.8, motion:['cel-tumble', 16, 'linear', false] });
    A('burst2', { fill:'conic', depth:0.8, motion:['cel-spin-rev', 12, 'steps(16)', false] });

    // ---- dots drift in small orbits while breathing
    D.pieces.filter(p => p.kind === 'dot').forEach((p, j) => {
      const r = seededRng('obsd:' + p.id);
      add(p, { fill:'orb', depth:1, motion:['cel-breathe', 2 + r() * 2.4, 'ease-in-out', true],
        orbit:['cel-orbit', 5 + r() * 5, 14 + r() * 22, j % 2 === 1] });
    });

    obsShiftPalette();
  }

  function openObservatory(){
    try{
      obsBuild();
    }catch(err){
      // Never crash the ship: undo the half-built room, say what went wrong, stay on the Deck Plan.
      console.error('Galaxy FM observatory failed to build:', err);
      obsBuilt = false; obsSlots = [];
      $('#obs-stage').innerHTML = '';
      showStatus('The Observatory could not open: ' + (err && err.message ? err.message : String(err)));
      openDeckPlan();
      return;
    }
    const ov = $('#obs-overlay');
    ov.classList.remove('hidden');
    ov.classList.toggle('obs-still', !motionEnabled());
    $('#obs-scroll').scrollTop = 0;
    obsShiftPalette();
    const hint = $('#obs-hint');
    hint.style.animation = 'none'; void hint.offsetWidth; hint.style.animation = '';
  }
  function closeObservatory(){
    $('#obs-overlay').classList.add('hidden');
  }
  $('#room-observatory').addEventListener('click', () => {
    closeDeckPlan();
    openObservatory();
  });
  $('#obs-back-to-deck').addEventListener('click', (e) => {
    e.stopPropagation();
    closeObservatory();
    openDeckPlan();
  });
  $('#obs-close').addEventListener('click', (e) => {
    e.stopPropagation();
    closeObservatory();
  });
  // tap anywhere on the art to shift the palette; pointer movement nudges each piece by its depth
  $('#obs-scroll').addEventListener('click', obsShiftPalette);
  $('#obs-overlay').addEventListener('pointermove', (e) => {
    const stage = $('#obs-stage');
    stage.style.setProperty('--px', ((e.clientX / window.innerWidth - 0.5) * 2).toFixed(3));
    stage.style.setProperty('--py', ((e.clientY / window.innerHeight - 0.5) * 2).toFixed(3));
  });

  /* ---- bridge (poetry room) ---- */
  const DEMO_POEMS = [
    ['A demo poem \u2014', 'connect your Drive and add a poetry.txt file', 'to the root of your Galaxy folder', 'to broadcast real verses here.'],
    ['A second demo poem \u2014', 'add a line that just says <warp>', 'between poems in your file', 'to mark where one ends and the next begins.']
  ];
  // Blank lines are purely for your own readability in the file and are
  // always ignored — they never split poems. The ONLY thing that starts
  // a new poem is a line containing just <warp> by itself.
  function parsePoems(text){
    const normalized = text.replace(/\r\n?/g, '\n');
    const lines = normalized.split('\n');
    const poems = [];
    let current = [];
    for(const rawLine of lines){
      const line = rawLine.trim();
      if(/^<warp>$/i.test(line)){
        if(current.length) poems.push(current);
        current = [];
        continue;
      }
      if(line) current.push(line);
    }
    if(current.length) poems.push(current);
    return poems;
  }
  async function loadPoems(){
    if(state.poetry) return state.poetry;
    let poems = [];
    try{
      if(state.galaxy.demo){
        poems = DEMO_POEMS;
      } else if(state.galaxy.poetryFileId){
        const txt = await driveFetchText(state.galaxy.poetryFileId);
        poems = parsePoems(txt);
      }
    }catch(e){ poems = []; }
    state.poetry = poems;
    return poems;
  }
  let bridgePoemIdx = -1, bridgeLineIdx = 0;
  function pickNewPoem(poems){
    if(poems.length === 1) return 0;
    let idx;
    do{ idx = Math.floor(Math.random() * poems.length); }while(idx === bridgePoemIdx);
    return idx;
  }
  // A curated set of hue pairs pulled from well-loved, widely-used color
  // combinations (Beach Towels, Rainbow Dash, Metro UI, Program Catalog,
  // Google's brand palette, Moonlight Bytes) rather than pure randomness —
  // so every poem's colors are a real, designer-vetted combo, not a
  // coin-flip that might land on two shades that look nearly identical.
  // Each pair is [textHue, starHue].
  const POEM_COLOR_PAIRS = [
    [0, 187],    // Beach Towels — red / teal
    [45, 187],   // Beach Towels — yellow / teal
    [4, 198],    // Rainbow Dash — red / blue
    [21, 198],   // Rainbow Dash — orange / blue
    [55, 198],   // Rainbow Dash — yellow / blue
    [93, 4],     // Rainbow Dash — green / red
    [345, 150],  // Metro UI — crimson / spring green
    [192, 44],   // Metro UI — electric blue / marigold
    [21, 192],   // Metro UI — orange / blue
    [46, 185],   // Program Catalog — goldenrod / teal
    [356, 185],  // Program Catalog — tomato / teal
    [150, 217],  // Google colors — green / blue
    [11, 185],   // Moonlight Bytes — coral / teal
    [43, 184]    // Moonlight Bytes — gold / teal
  ];
  let lastPoemPairIdx = -1;
  function pickPoemColorPair(){
    if(POEM_COLOR_PAIRS.length === 1) return POEM_COLOR_PAIRS[0];
    let idx;
    do{ idx = Math.floor(Math.random() * POEM_COLOR_PAIRS.length); }while(idx === lastPoemPairIdx);
    lastPoemPairIdx = idx;
    // Randomly swap which hue in the pair goes to text vs. stars, and
    // nudge each a few degrees so repeats don't feel identical every time.
    const [a, b] = POEM_COLOR_PAIRS[idx];
    const jitter = () => Math.floor(Math.random() * 14 - 7);
    const pair = Math.random() < 0.5 ? [a, b] : [b, a];
    return [(pair[0] + jitter() + 360) % 360, (pair[1] + jitter() + 360) % 360];
  }
  // Applies a poem's color pair: the text/glow gets one hue, the ambient
  // starfield (and the warp burst that carries the viewer into it) gets
  // the other — always a real, well-matched combo rather than a random roll.
  let bridgeStarHueForWarp = 210;
  function applyPoemColor(textHue, starHue){
    const linesEl = $('#bridge-poem-lines');
    linesEl.style.setProperty('--line-color', 'hsl(' + textHue + ' 85% 74%)');
    linesEl.style.setProperty('--line-glow', 'hsl(' + textHue + ' 90% 60% / .5)');
    bridgeStarHueForWarp = starHue;
    if(bridgeSetStarHue) bridgeSetStarHue(starHue);
  }
  function appendBridgeLine(text){
    const linesEl = $('#bridge-poem-lines');
    const scrollEl = $('#bridge-content');
    const p = document.createElement('p');
    p.className = 'bridge-line-item';
    p.textContent = text;
    linesEl.appendChild(p);
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }
  function clearBridgeLines(){
    $('#bridge-poem-lines').innerHTML = '';
    $('#bridge-content').scrollTop = 0;
  }
  function renderBridgeHint(poems){
    const hintEl = $('#bridge-hint');
    if(!poems.length){ hintEl.textContent = ''; return; }
    const poem = poems[bridgePoemIdx];
    hintEl.textContent = bridgeLineIdx === poem.length - 1 ? 'continue to a new poem' : 'continue reading';
  }
  const BRIDGE_WARP_MS = 1750;
  let bridgeBusy = false;
  async function advanceBridge(){
    if(bridgeBusy) return;
    const poems = await loadPoems();
    if(!poems.length) return;
    const poem = poems[bridgePoemIdx];
    const isLastLine = bridgeLineIdx >= poem.length - 1;
    const warpBtn = $('#bridge-warp-btn');

    if(!isLastLine){
      // Just reveal the next line of the poem already on screen — no
      // warp effect, the whole poem stays visible to read as one piece.
      bridgeBusy = true;
      warpBtn.disabled = true;
      bridgeLineIdx++;
      appendBridgeLine(poem[bridgeLineIdx]);
      renderBridgeHint(poems);
      warpBtn.disabled = false;
      bridgeBusy = false;
      return;
    }

    // Poem's finished — warp to a brand new one.
    bridgeBusy = true;
    warpBtn.disabled = true;

    const nextIdx = pickNewPoem(poems);
    const [nextTextHue, nextStarHue] = pickPoemColorPair();

    $('#bridge-poem-lines').classList.add('hidden');
    const scanEl = $('#bridge-scan-msg');
    scanEl.classList.remove('hidden');
    scanEl.style.animation = 'none';
    void scanEl.offsetWidth;
    scanEl.style.animation = '';
    $('#bridge-hint').textContent = '';

    // The stars shift to the arriving poem's color right as the warp begins.
    applyPoemColor(nextTextHue, nextStarHue);
    if(bridgeWarpBurst) bridgeWarpBurst(BRIDGE_WARP_MS, nextStarHue);

    await new Promise(r => setTimeout(r, motionEnabled() ? BRIDGE_WARP_MS : 250));

    bridgePoemIdx = nextIdx;
    bridgeLineIdx = 0;
    clearBridgeLines();
    appendBridgeLine(poems[bridgePoemIdx][0]);

    scanEl.classList.add('hidden');
    $('#bridge-poem-lines').classList.remove('hidden');
    renderBridgeHint(poems);
    warpBtn.disabled = false;
    bridgeBusy = false;
  }
  async function openBridge(){
    $('#bridge-overlay').classList.remove('hidden');
    $('#bridge-scan-msg').classList.add('hidden');
    $('#bridge-poem-lines').classList.remove('hidden');
    $('#bridge-warp-btn').disabled = false;
    bridgeBusy = false;
    startBridgeStarfield();
    clearBridgeLines();
    const poems = await loadPoems();
    if(poems.length){
      bridgePoemIdx = pickNewPoem(poems);
      bridgeLineIdx = 0;
      const [textHue, starHue] = pickPoemColorPair();
      applyPoemColor(textHue, starHue);
      appendBridgeLine(poems[bridgePoemIdx][0]);
    }else{
      appendBridgeLine('Add a poetry.txt file to the root of your Galaxy folder to begin.');
    }
    renderBridgeHint(poems);
  }
  function closeBridge(){
    $('#bridge-overlay').classList.add('hidden');
    if(stopBridgeStarfield) stopBridgeStarfield();
  }
  $('#room-bridge').addEventListener('click', () => {
    closeDeckPlan();
    openBridge();
  });
  $('#bridge-back-to-deck').addEventListener('click', (e) => {
    e.stopPropagation();
    closeBridge();
    openDeckPlan();
  });
  $('#bridge-close').addEventListener('click', (e) => {
    e.stopPropagation();
    closeBridge();
  });
  $('#bridge-warp-btn').addEventListener('click', advanceBridge);

  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    if(!$('#log-overlay').classList.contains('hidden')) closeCaptainsLog();
    else if(!$('#engine-overlay').classList.contains('hidden')) closeEngineRoom();
    else if(!$('#bridge-overlay').classList.contains('hidden')) closeBridge();
    else if(!$('#comms-overlay').classList.contains('hidden')) closeCommsRoom();
    else if(!$('#cargo-overlay').classList.contains('hidden')) closeCargoBay();
    else if(!$('#obs-overlay').classList.contains('hidden')) closeObservatory();
    else if(!$('#deck-plan-overlay').classList.contains('hidden')) closeDeckPlan();
    else if(!$('#detail-overlay').classList.contains('hidden')) closeDetail();
  });

  /* ---- breadcrumb nav ---- */
  $('#crumb-galaxy').addEventListener('click', () => {
    closeDetail();
    renderGalaxyView();
  });

  /* =========================================================
     Background scan: quietly checks each system for newly
     discovered planets/moons so the galaxy view can flag them
     without blocking the initial page load.
     ========================================================= */
  async function backgroundScanForNew(){
    for(const sys of state.galaxy.systems){
      try{
        await loadSystem(sys);
        if(sys.planets.some(p => p.isNewFlag)) markSystemCardNew(sys.id);
        sys.planets.forEach(p => {
          if(isNew(p.createdTime)){
            state.discoveries.push({ type:'planet', name:p.name, systemName:sys.name, createdTime:p.createdTime, system:sys, planet:p });
          }
          p.moons.forEach(m => {
            if(isNew(m.createdTime)){
              state.discoveries.push({ type:'moon', name:m.name, planetName:p.name, systemName:sys.name, createdTime:m.createdTime, system:sys, planet:p, moon:m });
            }
          });
          if(p.isFeatured){
            state.featured.push({ name:p.name, systemName:sys.name, system:sys, planet:p });
          }
        });
        renderDiscoveriesTicker();
        renderFeaturedSection();
        renderRecentDiscoveries();
      }catch(e){ /* skip quietly */ }
      await new Promise(r => setTimeout(r, 150));
    }
  }

  function formatDiscoveryDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function renderRecentDiscoveries(){
    const wrap = $('#recent-discoveries-section');
    const row = $('#recent-discoveries-row');
    const all = [];
    state.galaxy.systems.forEach(sys => {
      if(!sys.planetsLoaded) return;
      sys.planets.forEach(p => {
        if(p.createdTime) all.push({ planet:p, system:sys });
      });
    });
    const latestWrap = $('#latest-discovery-section');
    if(!all.length){ wrap.classList.add('hidden'); latestWrap.classList.add('hidden'); return; }
    all.sort((a, b) => new Date(b.planet.createdTime) - new Date(a.planet.createdTime));

    // The single newest mix gets the big "Latest Discovery" card on top.
    const latest = all[0];
    const lp = latest.planet;
    const slot = $('#latest-discovery-slot');
    slot.innerHTML =
      '<button class="latest-card" style="' + paletteStyle(lp.traits.palette) + '">' +
        '<span class="big-planet-frame' + (lp.traits.hasRings ? ' has-rings' : '') + '">' + planetVisualHTML(lp.traits) + '</span>' +
        '<span class="latest-text">' +
          (lp.isNewFlag ? '<span class="latest-kicker">✦ newly discovered</span>' : '') +
          '<span class="latest-name">' + escapeHTML(lp.name) + '</span>' +
          '<span class="latest-meta">' + escapeHTML(latest.system.name) + '</span>' +
          '<span class="latest-date">' + formatDiscoveryDate(lp.createdTime) + '</span>' +
          '<span class="latest-chips">' + traitChips(lp.traits, false) + '</span>' +
          '<span class="latest-life">' + escapeHTML(lp.traits.lifeText) + '</span>' +
          '<span class="latest-cta">Open transmission ›</span>' +
        '</span>' +
      '</button>';
    latestWrap.classList.remove('hidden');
    slot.querySelector('.latest-card').addEventListener('click', async () => {
      closeDetail();
      await enterSystem(latest.system);
      openPlanetDetail(latest.planet);
    });

    // Recent Discoveries carries on with the next three, so the latest isn't shown twice.
    const top = all.slice(1, 4);
    if(!top.length){ wrap.classList.add('hidden'); return; }
    row.innerHTML = top.map((entry, i) => {
      const p = entry.planet;
      return '<button class="recent-card" data-idx="' + i + '">' +
        '<span class="mini-planet-frame">' + planetVisualHTML(p.traits) + '</span>' +
        '<span class="name">' + escapeHTML(p.name) + '</span>' +
        '<span class="meta">' + escapeHTML(entry.system.name) + '</span>' +
        '<span class="date">' + formatDiscoveryDate(p.createdTime) + '</span>' +
        '</button>';
    }).join('');
    wrap.classList.remove('hidden');

    row.querySelectorAll('.recent-card').forEach(btn => {
      btn.addEventListener('click', async () => {
        const entry = top[parseInt(btn.dataset.idx, 10)];
        if(!entry) return;
        closeDetail();
        await enterSystem(entry.system);
        openPlanetDetail(entry.planet);
      });
    });
  }

  function renderDiscoveriesTicker(){
    const wrap = $('#discoveries-ticker');
    const track = $('#discoveries-track');
    if(!state.discoveries.length){ wrap.classList.add('hidden'); return; }
    const sorted = state.discoveries.slice().sort((a, b) => new Date(b.createdTime) - new Date(a.createdTime));
    const itemHTML = sorted.map((d, i) => {
      const label = d.type === 'moon'
        ? escapeHTML(d.name) + ' <span class="discovery-sub">(moon of ' + escapeHTML(d.planetName) + ')</span>'
        : '<b>' + escapeHTML(d.name) + '</b>';
      return '<button class="discovery-item" data-idx="' + i + '"><span class="spark"></span> ' + label +
        ' <span class="discovery-sub">\u2014 ' + escapeHTML(d.systemName) + '</span></button>';
    }).join('');
    track.innerHTML = itemHTML + itemHTML; // duplicated so the loop scrolls seamlessly
    track.style.setProperty('--ticker-duration', Math.max(18, sorted.length * 6) + 's');
    wrap.classList.toggle('no-motion', !motionEnabled());
    wrap.classList.remove('hidden');

    track.querySelectorAll('.discovery-item').forEach(btn => {
      btn.addEventListener('click', async () => {
        const d = sorted[parseInt(btn.dataset.idx, 10)];
        if(!d) return;
        closeDetail();
        await enterSystem(d.system);
        if(d.type === 'moon') openMoonDetail(d.moon, d.planet);
        else openPlanetDetail(d.planet);
      });
    });
  }

  function renderFeaturedSection(){
    const wrap = $('#featured-section');
    const row = $('#featured-row');
    if(!state.featured.length){ wrap.classList.add('hidden'); return; }
    row.innerHTML = state.featured.map((f, i) => {
      return '<button class="featured-card" data-idx="' + i + '">' +
        '<span class="mini-planet-frame">' + planetVisualHTML(f.planet.traits) + '</span>' +
        '<span class="name">' + escapeHTML(f.name) + '</span>' +
        '<span class="meta">' + escapeHTML(f.systemName) + '</span>' +
        '</button>';
    }).join('');
    wrap.classList.remove('hidden');

    row.querySelectorAll('.featured-card').forEach(btn => {
      btn.addEventListener('click', async () => {
        const f = state.featured[parseInt(btn.dataset.idx, 10)];
        if(!f) return;
        closeDetail();
        await enterSystem(f.system);
        openPlanetDetail(f.planet);
      });
    });
  }

  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  /* =========================================================
     Init
     ========================================================= */
  async function init(){
    if(CONFIG.FORCE_MOTION) document.body.classList.add('motion-forced');
    renderStarfield();
    try{
      if(!isConfigured()) throw new Error('not configured');
      state.galaxy = await loadGalaxy();
      if(!state.galaxy.systems.length) throw new Error('empty galaxy');
    }catch(e){
      state.galaxy = buildDemoGalaxy();
      showStatus(isConfigured()
        ? 'Couldn\u2019t load your Drive folder \u2014 showing demo data. Check the API key, folder ID, and sharing settings in CONFIG.'
        : 'Showing demo data. Add your Google Drive API key & folder ID in the CONFIG block (top of this file\u2019s source) to broadcast your real mixes.');
    }
    renderGalaxyView();
    renderRecentDiscoveries();
    if(!state.galaxy.demo) setTimeout(backgroundScanForNew, 400);
  }

  init();
})();
</script>
</body>
</html>
