<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy FM</title>
<meta name="description" content="Browse a galaxy of DJ mixes — every solar system is a session, every planet and moon is a track.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060f;
    --bg-panel:#0d0f24;
    --bg-panel-2:#131634;
    --text:#e9ecff;
    --text-dim:#8d92bd;
    --border:rgba(255,255,255,.09);
    --accent:#8f7bff;
    --accent-2:#4fd1c5;
    --new:#ffcf5c;
    --radius-lg:20px;
    --radius-md:12px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--text); }
  body{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    line-height:1.55;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; color:inherit; }
  a{ color:var(--accent-2); }

  /* ---------- background layers ---------- */
  #nebula{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, hsl(var(--nebula-hue,260) 70% 25% / .35), transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 70%, hsl(calc(var(--nebula-hue,260) + 100) 70% 25% / .28), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, hsl(calc(var(--nebula-hue,260) + 200) 60% 20% / .25), transparent 65%);
  }
  #starfield{ position:fixed; inset:0; z-index:0; pointer-events:none; display:block; }

  /* ---------- layout shell ---------- */
  #app{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    padding:18px 20px; position:sticky; top:0; z-index:5;
    background:linear-gradient(to bottom, rgba(5,6,15,.92), rgba(5,6,15,.7) 70%, transparent);
    backdrop-filter:blur(6px);
  }
  #crumb-group{ display:flex; align-items:center; gap:8px; }
  .crumb{
    background:none; border:none; cursor:pointer; font-size:14px;
    letter-spacing:.04em; color:var(--text-dim); padding:6px 4px;
  }
  .crumb.current, .crumb:hover{ color:var(--text); }
  .crumb-sep{ color:var(--text-dim); }
  .hidden{ display:none !important; }

  #status{
    margin:0 20px 10px; padding:10px 14px; border-radius:var(--radius-md);
    background:var(--bg-panel-2); border:1px solid var(--border);
    font-size:12.5px; color:var(--text-dim); display:flex; gap:10px; align-items:flex-start; justify-content:space-between;
  }
  #status button{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; line-height:1; }

  main{ padding:10px 20px 60px; max-width:1100px; margin:0 auto; width:100%; }

  /* ---------- galaxy view ---------- */
  #galaxy-hero{ text-align:center; padding:30px 10px 40px; max-width:640px; margin:0 auto; }
  #galaxy-title{ font-size:clamp(28px,6vw,44px); letter-spacing:.01em; }
  #galaxy-readme{ margin-top:14px; color:var(--text-dim); font-size:13.5px; white-space:pre-line; }

  #systems-grid{
    display:grid; gap:22px;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
  }
  .section-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim);
    margin:0 0 14px;
  }
  #featured-section{ margin-bottom:34px; }
  #captain-message-section{ margin-bottom:34px; }
  #captain-message-box{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:16px;
    padding:18px 20px; color:var(--text); font-size:13.5px; line-height:1.75; white-space:pre-line;
  }
  #featured-row{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
  .featured-card{
    flex:0 0 auto; width:112px; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--bg-panel); border:1px solid var(--border); border-radius:16px;
    padding:16px 10px 12px; cursor:pointer;
  }
  .featured-card:hover, .featured-card:focus-visible{ border-color:var(--accent-2); outline:none; }
  .featured-card .mini-planet-frame{ display:block; width:52px; height:52px; position:relative; }
  .featured-card .name{ font-size:11.5px; font-weight:600; text-align:center; line-height:1.25; }
  .featured-card .meta{ font-size:10px; color:var(--text-dim); text-align:center; }
  #recent-discoveries-section{ margin-bottom:34px; }
  #recent-discoveries-row{ display:flex; gap:18px; overflow-x:auto; padding-bottom:10px; }
  .recent-card{
    flex:0 0 auto; width:172px; display:flex; flex-direction:column; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(79,209,197,.08), var(--bg-panel) 60%);
    border:1px solid var(--accent-2); border-radius:20px;
    padding:22px 14px 16px; cursor:pointer;
    box-shadow:0 0 22px rgba(79,209,197,.15);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .recent-card:hover, .recent-card:focus-visible{
    outline:none; transform:translateY(-3px); box-shadow:0 0 30px rgba(79,209,197,.32);
  }
  .recent-card .mini-planet-frame{ display:block; width:86px; height:86px; position:relative; }
  .recent-card .name{ font-size:14.5px; font-weight:700; text-align:center; line-height:1.3; }
  .recent-card .meta{ font-size:11px; color:var(--text-dim); text-align:center; }
  .recent-card .date{ font-size:10.5px; color:var(--accent-2); text-align:center; letter-spacing:.04em; font-weight:600; }

  /* ---- Latest Discovery: the single newest mix, shown large ---- */
  #latest-discovery-section{ margin-bottom:34px; }
  .latest-card{
    position:relative; width:100%; display:flex; align-items:center; gap:34px;
    padding:34px 38px; border-radius:28px; cursor:pointer; text-align:left;
    background:
      radial-gradient(ellipse 60% 90% at 18% 50%, color-mix(in srgb, var(--c2) 26%, transparent), transparent 70%),
      radial-gradient(ellipse 50% 80% at 92% 20%, color-mix(in srgb, var(--c4) 22%, transparent), transparent 70%),
      var(--bg-panel);
    border:1px solid color-mix(in srgb, var(--c1) 75%, transparent);
    box-shadow:0 0 44px color-mix(in srgb, var(--c1) 30%, transparent), 0 0 90px color-mix(in srgb, var(--c4) 18%, transparent);
    color:var(--text); font-family:inherit;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .latest-card:hover, .latest-card:focus-visible{
    outline:none; transform:translateY(-3px);
    box-shadow:0 0 58px color-mix(in srgb, var(--c1) 48%, transparent), 0 0 110px color-mix(in srgb, var(--c4) 28%, transparent);
  }
  .big-planet-frame{ flex:0 0 auto; display:block; width:190px; height:190px; position:relative; margin:0 12px; }
  .big-planet-frame.has-rings{ margin:0 66px; }
  .latest-text{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .latest-kicker{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--new); }
  .latest-name{ font-family:'Space Grotesk', sans-serif; font-size:clamp(28px, 5vw, 42px); font-weight:700; line-height:1.1; }
  .latest-meta{ font-size:13px; color:var(--text-dim); }
  .latest-date{ font-size:11.5px; color:var(--c3); letter-spacing:.05em; font-weight:600; }
  .latest-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .latest-life{ font-size:12.5px; font-style:italic; color:var(--c3); margin-top:4px; }
  .latest-cta{ margin-top:10px; font-size:12.5px; font-weight:600; letter-spacing:.04em; color:var(--c2); }
  @media (max-width:620px){
    .latest-card{ flex-direction:column; text-align:center; gap:20px; padding:28px 20px; }
    .latest-text{ align-items:center; }
    .latest-chips{ justify-content:center; }
    .big-planet-frame{ width:150px; height:150px; }
    .big-planet-frame.has-rings{ margin:0 12px; }
  }
  .sun-card{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:22px 16px 18px; text-align:center; cursor:pointer;
    transition:transform .2s ease, border-color .2s ease;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    position:relative;
  }
  .sun-card:hover, .sun-card:focus-visible{ transform:translateY(-3px); border-color:var(--accent); outline:none; }
  /* Psychedelic palette plumbing: every star, planet and moon carries five
     colours as --c1..--c5 (set inline from the palette engine in JS) and an
     animatable --spin angle for swirling conic gradients. */
  @property --spin{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  @keyframes psy-spin{ to{ --spin:360deg; } }
  @keyframes psy-hue{ to{ filter:hue-rotate(360deg); } }
  @keyframes psy-flow{ from{ background-position:0 0, 0 0; } to{ background-position:0 0, 0 100%; } }
  :root{
    --c1:#ff2e93; --c2:#ffe74c; --c3:#2ec4b6; --c4:#7b2ff7; --c5:#ff9f1c;
    --gloss:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.62), rgba(255,255,255,0) 30%),
      radial-gradient(circle at 78% 84%, rgba(0,0,0,.34), rgba(0,0,0,0) 58%);
  }
  .sun-visual{
    display:block; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #fff 0 7%, var(--c1) 30%, var(--c2) 62%, var(--c3) 100%);
    box-shadow:0 0 22px 2px color-mix(in srgb, var(--c1) 70%, transparent), 0 0 46px 6px color-mix(in srgb, var(--c4) 45%, transparent);
  }
  .sun-card .name{ font-size:14px; font-weight:600; }
  .sun-card .meta{ font-size:11px; color:var(--text-dim); }
  .new-dot{
    position:absolute; top:12px; right:12px; width:8px; height:8px; border-radius:50%;
    background:var(--new); box-shadow:0 0 8px var(--new);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:.5; transform:scale(.9); } 50%{ opacity:1; transform:scale(1.15); } }

  /* ---------- system / orbit view ---------- */
  #system-sun-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:10px 10px 0; }
  .sun{ width:80px; height:80px; border-radius:50%; margin-bottom:8px;
    background:radial-gradient(circle at 38% 32%, #fff 0 7%, var(--c1) 30%, var(--c2) 62%, var(--c3) 100%);
    box-shadow:0 0 38px 4px color-mix(in srgb, var(--c1) 70%, transparent), 0 0 80px 12px color-mix(in srgb, var(--c4) 45%, transparent); }

  /* Star visual styles — all palette-driven (--c1..--c5), layered on top of
     .sun / .sun-visual. The "plain" star is the base glowing orb above. */
  .sun.star-speckled, .sun-visual.star-speckled{
    background:
      radial-gradient(circle at 22% 24%, rgba(255,255,255,.95) 0 1px, transparent 1.6px),
      radial-gradient(circle at 66% 16%, rgba(255,255,255,.8) 0 1px, transparent 1.6px),
      radial-gradient(circle at 42% 68%, rgba(255,255,255,.9) 0 1px, transparent 1.6px),
      radial-gradient(circle at 80% 58%, rgba(255,255,255,.7) 0 1px, transparent 1.6px),
      radial-gradient(circle at 26% 84%, rgba(255,255,255,.8) 0 1px, transparent 1.6px),
      radial-gradient(circle at 58% 42%, rgba(255,255,255,.65) 0 1px, transparent 1.6px),
      radial-gradient(circle at 70% 78%, var(--c5) 0 8%, transparent 9%),
      radial-gradient(circle at 30% 60%, var(--c4) 0 10%, transparent 11%),
      radial-gradient(circle at 35% 30%, var(--c1), var(--c2) 60%, var(--c3) 100%);
  }
  .sun.star-marbled, .sun-visual.star-marbled{
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), transparent 32%),
      conic-gradient(from var(--spin) at 50% 50%, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c1));
    animation:psy-spin var(--spin-dur, 24s) linear infinite; animation-delay:var(--spin-delay, 0s);
  }
  .sun.star-cat-eye, .sun-visual.star-cat-eye{
    position:relative; overflow:hidden;
    background:radial-gradient(circle at 50% 50%, var(--c2) 0 18%, var(--c1) 45%, var(--c4) 100%);
  }
  .sun.star-cat-eye::after, .sun-visual.star-cat-eye::after{
    content:''; position:absolute; left:50%; top:10%; bottom:10%; width:20%;
    transform:translateX(-50%); background:rgba(4,5,13,.92); border-radius:50%;
    box-shadow:0 0 8px var(--c3), 0 0 16px var(--c3);
  }
  .sun.star-neon, .sun-visual.star-neon{
    background:radial-gradient(circle at 35% 30%, #fff 0 6%, var(--c1) 34%, var(--c2) 100%);
    box-shadow:
      0 0 14px var(--c1),
      0 0 32px var(--c2),
      0 0 56px var(--c3),
      0 0 84px color-mix(in srgb, var(--c4) 70%, transparent);
    animation:neon-pulse 2.4s ease-in-out infinite;
  }
  .sun.star-silver, .sun-visual.star-silver{
    position:relative; overflow:hidden;
    background:radial-gradient(circle at 35% 30%, #f6f8ff, #b9c2dd 55%, #6c7590 100%) !important;
    box-shadow:0 0 22px 2px color-mix(in srgb, var(--c1) 80%, transparent), 0 0 48px 6px color-mix(in srgb, var(--c3) 55%, transparent) !important;
  }
  .sun.star-prism, .sun-visual.star-prism{
    background:
      radial-gradient(circle, #fff 0 8%, rgba(255,255,255,0) 46%),
      repeating-conic-gradient(from var(--spin) at 50% 50%, var(--c1) 0 12deg, var(--c2) 12deg 24deg, var(--c3) 24deg 36deg, var(--c4) 36deg 48deg, var(--c5) 48deg 60deg);
    animation:psy-spin var(--spin-dur, 24s) linear infinite; animation-delay:var(--spin-delay, 0s);
  }
  .sun.star-tie-dye, .sun-visual.star-tie-dye{
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.55), transparent 28%),
      repeating-radial-gradient(circle at 46% 54%, var(--c1) 0 9%, var(--c2) 9% 18%, var(--c3) 18% 27%, var(--c4) 27% 36%, var(--c5) 36% 45%);
    animation:psy-hue calc(var(--spin-dur, 24s) * 1.2) linear infinite; animation-delay:var(--spin-delay, 0s);
  }
  .sun.star-silver::after, .sun-visual.star-silver::after{
    content:''; position:absolute; inset:-40%;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.6) 50%, transparent 60%);
    animation:silver-sheen 3.2s linear infinite;
  }
  @keyframes neon-pulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.28); } }
  @keyframes silver-sheen{ 0%{ transform:translateX(-60%); } 100%{ transform:translateX(60%); } }
  #system-title{ font-size:26px; }
  #system-sub{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; }
  #system-readme{ max-width:520px; color:var(--text-dim); font-size:13px; margin-top:6px; white-space:pre-line; }

  #orbit-field{
    position:relative; width:100%; height:min(88vw, 560px); margin-top:10px;
  }
  .orbit-ring{
    position:absolute; top:50%; left:50%; border:1px dashed rgba(255,255,255,.08); border-radius:50%;
    transform:translate(-50%,-50%); pointer-events:none;
  }
  .orbit-rotator{ position:absolute; top:50%; left:50%; width:0; height:0; }
  .planet-slot{ position:absolute; top:0; left:0; transform:translate(-50%,-50%); }
  .planet-btn{
    position:relative; border:none; background:none; cursor:pointer; padding:0;
    width:var(--size); height:var(--size); border-radius:50%;
  }
  .planet-btn:focus-visible{ outline:2px solid var(--accent-2); outline-offset:4px; border-radius:50%; }
  /* Planets: every surface type is a different psychedelic pattern built from
     the body's own five palette colours. --gloss adds the sphere highlight and
     shadow on top. Rock = swirling pinwheel, gas = flowing bands, ocean =
     ripple rings, ice = kaleidoscope, volcanic = lava-lamp blobs, crystal =
     faceted prism. */
  .planet-body{
    display:block; width:100%; height:100%; border-radius:50%; position:relative;
    background:
      var(--gloss),
      conic-gradient(from var(--spin) at 55% 48%, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c1));
    box-shadow:inset -5px -5px 12px rgba(0,0,0,.4), 0 0 14px color-mix(in srgb, var(--c1) 55%, transparent);
    animation:psy-spin var(--spin-dur, 40s) linear infinite; animation-delay:var(--spin-delay, 0s);
  }
  .planet-body.surf-gas{
    background:
      var(--gloss),
      linear-gradient(180deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c1));
    background-size:100% 100%, 100% 50%;
    background-repeat:no-repeat, repeat;
    animation:psy-flow var(--spin-dur, 40s) linear infinite; animation-delay:var(--spin-delay, 0s);
  }
  .planet-body.surf-ocean{
    background:
      var(--gloss),
      repeating-radial-gradient(circle at 40% 36%, var(--c1) 0 7%, var(--c2) 7% 14%, var(--c3) 14% 21%, var(--c4) 21% 28%, var(--c5) 28% 35%);
    animation:psy-hue var(--spin-dur, 40s) linear infinite; animation-delay:var(--spin-delay, 0s);
  }
  .planet-body.surf-ice{
    background:
      var(--gloss),
      radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 52%),
      repeating-conic-gradient(from var(--spin) at 50% 50%, var(--c1) 0 15deg, var(--c3) 15deg 30deg, var(--c5) 30deg 45deg, var(--c2) 45deg 60deg);
  }
  .planet-body.surf-volcanic{
    background:
      var(--gloss),
      radial-gradient(circle at 24% 72%, var(--c4) 0 17%, transparent 18%),
      radial-gradient(circle at 72% 28%, var(--c3) 0 21%, transparent 22%),
      radial-gradient(circle at 64% 76%, var(--c5) 0 13%, transparent 14%),
      radial-gradient(circle at 30% 22%, var(--c2) 0 11%, transparent 12%),
      linear-gradient(135deg, var(--c1), var(--c2));
    animation:psy-hue var(--spin-dur, 40s) linear infinite; animation-delay:var(--spin-delay, 0s);
  }
  .planet-body.surf-crystal{
    background:
      var(--gloss),
      repeating-linear-gradient(62deg, rgba(255,255,255,.28) 0 2px, rgba(255,255,255,0) 2px 15px),
      conic-gradient(from var(--spin) at 50% 50%, var(--c1), var(--c2), var(--c3), var(--c1), var(--c4), var(--c5), var(--c1));
  }

  .atmos-glow{ position:absolute; inset:-22%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, var(--c2), transparent 70%); opacity:calc(var(--atmos-o, 0) * 1.9); }

  .ring::before, .ring::after{
    content:''; position:absolute; left:50%; top:50%; pointer-events:none;
    width:170%; height:60%; border:2px solid var(--c3); opacity:.85;
    box-shadow:0 0 8px var(--c4);
    border-radius:50%; transform:translate(-50%,-50%) rotate(-14deg) scaleY(.4);
  }
  .ring::after{ width:205%; height:72%; border-color:var(--c5); opacity:.6; box-shadow:0 0 8px var(--c1); }

  .life-microbial .planet-body{ box-shadow:inset -6px -6px 14px rgba(0,0,0,.55), 0 0 10px hsl(140 70% 55% / .35); }
  .life-inhabited .planet-body{ box-shadow:inset -6px -6px 14px rgba(0,0,0,.55), 0 0 16px hsl(140 80% 60% / .55); }
  .life-advanced .planet-body{ box-shadow:inset -6px -6px 14px rgba(0,0,0,.55), 0 0 20px hsl(46 90% 65% / .65); }
  .life-inhabited .planet-body::after, .life-advanced .planet-body::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 60% 65%, hsl(46 90% 70% / .5) 0 2px, transparent 3px);
    animation:blink 2.4s steps(1) infinite;
  }
  @keyframes blink{ 0%,45%{ opacity:1; } 46%,54%{ opacity:0; } 55%,100%{ opacity:1; } }

  .is-new .planet-btn::before{
    content:'\2726 NEW'; position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    font-size:9px; letter-spacing:.06em; color:var(--new); white-space:nowrap;
    animation:pulse 1.6s ease-in-out infinite;
  }
  .planet-label{
    display:block; text-align:center; font-size:10.5px; color:var(--text-dim);
    margin-top:6px; white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis;
  }

  @media (prefers-reduced-motion: reduce){
    body:not(.motion-forced) .planet-body,
    body:not(.motion-forced) .moon-body,
    body:not(.motion-forced) .sun,
    body:not(.motion-forced) .sun-visual{
      animation:none !important;
    }
  }
  @media (prefers-reduced-motion: reduce){
    body:not(.motion-forced) .orbit-rotator,
    body:not(.motion-forced) .planet-slot,
    body:not(.motion-forced) .new-dot,
    body:not(.motion-forced) .life-inhabited .planet-body::after,
    body:not(.motion-forced) .life-advanced .planet-body::after,
    body:not(.motion-forced) .star-neon,
    body:not(.motion-forced) .star-silver::after{
      animation:none !important;
    }
  }

  /* ---------- detail overlay ---------- */
  #detail-overlay{
    position:fixed; inset:0; z-index:20; background:rgba(3,4,10,.72); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center;
  }
  #detail-panel{
    width:100%; max-width:560px; max-height:86vh; overflow-y:auto;
    background:var(--bg-panel); border:1px solid var(--border);

  /* =========================================================
     Psychedelic palette engine.
     PSYCHE_SOURCES is a bank of 5-colour palettes. Entries marked [CL] are
     real palettes from colourlovers.com (title in the comment); the rest are
     hand-tuned neon sets in the same spirit. To add more, paste any 5 hex
     codes as a new row — electrify() cranks the saturation up and keeps each
     colour's hue, so even muted palettes come out glowing.
     ========================================================= */
  const PSYCHE_SOURCES = [
    ['#FF33CC','#14B83D','#EB9E47','#1461B8','#510599'], // [CL] Dressed Up
    ['#AAFF00','#FFAA00','#FF00AA','#AA00FF','#00AAFF'], // [CL] Pop Is Everything
    ['#BCBDAC','#CFBE27','#F27435','#F02475','#3B2D38'], // [CL] Storming Psychedelia
    ['#331327','#991766','#D90F5A','#F34739','#FF6E27'], // [CL] Iridescent sunset
    ['#540045','#C60052','#FF714B','#EAFF87','#ACFFE9'], // [CL] Finalized
    ['#FF003C','#FF8A00','#FABE28','#88C100','#00C176'], // [CL] Sweet Lolly
    ['#A70267','#F10C49','#FB6B41','#F6D86B','#339194'], // [CL] mai
    ['#CC0C39','#E6781E','#C8CF02','#F8FCC1','#1693A7'], // [CL] vivacious
    ['#EFEECC','#FE8B05','#FE0557','#400403','#0AABBA'], // [CL] urban gypsy
    ['#360745','#D61C59','#E7D84B','#EFEAC5','#1B8798'], // [CL] 700 Magic ?'s
    ['#EC4401','#CC9B25','#13CD4A','#7B6ED6','#5E525C'], // [CL] Speechless
    ['#CCF390','#E0E05A','#F7C41F','#FC930A','#FF003D'], // [CL] a beautiful day
    ['#FF2E93','#FF9F1C','#FFE74C','#2EC4B6','#7B2FF7'],
    ['#00F5D4','#00BBF9','#9B5DE5','#F15BB5','#FEE440'],
    ['#FF006E','#FB5607','#FFBE0B','#8338EC','#3A86FF'],
    ['#F72585','#7209B7','#3A0CA3','#4361EE','#4CC9F0'],
    ['#CCFF00','#FF00AA','#00E5FF','#FF6A00','#6A00FF'],
    ['#EF476F','#FFD166','#06D6A0','#118AB2','#8E44FF'],
    ['#B5FF00','#00FFA3','#00B8FF','#7A00FF','#FF00E5'],
    ['#FFD60A','#FF5D8F','#C77DFF','#4CC9F0','#06FFA5'],
    ['#FF7B00','#FF00C8','#5A00FF','#00D4FF','#CFFF04'],
    ['#9D4EDD','#FF4D6D','#FFD60A','#00F5FF','#80FF72'],
    ['#D100D1','#FF3D00','#FFEA00','#00E676','#2979FF'],
    ['#00FFC6','#FF2079','#FFF200','#7C3AED','#FF7A18'],
    ['#39FF14','#FF073A','#0FF0FC','#FF9933','#BC13FE'],
    ['#FF5EAE','#FFA23A','#E8FF3A','#2BFFC6','#6E4BFF']
  ];
  function hexToHsl(hex){
    const n = parseInt(hex.slice(1), 16);
    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let h = 0, s = 0;
    if(mx !== mn){
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if(mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if(mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hslToHex(h, s, l){
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to = x => Math.round(x * 255).toString(16).padStart(2, '0');
    return '#' + to(f(0)) + to(f(8)) + to(f(4));
  }
  // Keep each colour's hue, force it vivid. Original lightness order is kept
  // (squeezed into 46-64%) so a palette still has some depth to it.
  function electrify(hex){
    const [h, s, l] = hexToHsl(hex);
    return hslToHex(h, Math.max(s, 0.9), 0.46 + 0.18 * l);
  }
  const PSYCHE_PALETTES = PSYCHE_SOURCES.map(p => p.map(electrify));
  function hueDist(a, b){ const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }
  // Deterministic palette for a body: a seeded palette, rotated and maybe
  // reversed, so 26 palettes yield hundreds of distinct looks.
  function palettePick(id, salt){
    const rng = seededRng('pal:' + salt + ':' + id);
    const base = pick(rng, PSYCHE_PALETTES);
    const rot = Math.floor(rng() * 5);
    let p = base.slice(rot).concat(base.slice(0, rot));
    if(rng() < 0.5) p.reverse();
    return p;
  }
  function paletteStyle(p){
    return p.map((c, i) => '--c' + (i + 1) + ':' + c).join(';') + ';';
  }
  function paletteHues(p){
    return [Math.round(hexToHsl(p[0])[0]), Math.round(hexToHsl(p[1])[0])];
  }

  function planetTraits(id){
    const rng = seededRng('planet:' + id);
    const surface = pick(rng, SURFACES);
    const atmosphere = pick(rng, ATMOSPHERES);
    const life = weightedPick(rng, [['barren',45],['microbial',30],['inhabited',20],['advanced',5]]);
    const hue = Math.floor(range(rng, 0, 360));
    const t = {
      size: Math.round(range(rng, 46, 108)),
      surface, atmosphere, life,
      lifeText: pick(rng, LIFE_FLAVOR[life]),
      hasRings: rng() < 0.125,
      hue, accent: (hue + Math.floor(range(rng, 30, 90))) % 360
    };
    // Colours come from a separate seeded stream, so size/surface/life/rings
    // above stay exactly as they were.
    const palette = palettePick(id, 'planet');
    const prng = seededRng('psy:' + id);
    const hues = paletteHues(palette);
    t.palette = palette; t.hue = hues[0]; t.accent = hues[1];
    t.spinDur = 28 + Math.floor(prng() * 52);
    t.spinPhase = prng();
    return t;
  }

  /* Auto-generated planet name + description, for mixes dropped straight
     into a solar system folder with no per-mix folder/readme of their own.
     Seeded from the audio file's ID, so a mix's invented identity is
     permanent even though nothing about it was hand-authored. */
  const NAME_ADJ = ['Crimson','Amber','Obsidian','Hollow','Static','Violet','Ashen','Silent','Drifting','Lunar','Frozen','Verdant','Hazy','Molten','Nocturne','Faded','Gilded','Wandering','Echo','Pale','Velvet','Errant','Sable','Glacial'];
  const NAME_NOUN = ['Hollow','Drift','Bloom','Reach','Expanse','Cradle','Veil','Tide','Basin','Spire','Rift','Wake','Halo','Grove','Shard','Bay','Ridge','Hush','Ember','Passage','Current','Fold','Reef','Horizon'];
  const NAME_NUMERALS = ['II','III','IV','V','VI','VII','VIII','IX','X'];

  function autoPlanetName(id){
    const rng = seededRng('name:' + id);
    let name = pick(rng, NAME_ADJ) + ' ' + pick(rng, NAME_NOUN);
    if(rng() < 0.3) name += ' ' + pick(rng, NAME_NUMERALS);
    return name;
  }
  function autoPlanetReadme(traits){
    return 'Survey log: a ' + traits.surface.label + ' world beneath ' + traits.atmosphere.label + '. ' + traits.lifeText;
  }
  function moonTraits(id){
    const rng = seededRng('moon:' + id);
    const atmosphere = pick(rng, MOON_ATMOSPHERES);
    const life = weightedPick(rng, [['barren',65],['microbial',25],['inhabited',9],['advanced',1]]);
    const hue = Math.floor(range(rng, 0, 360));
    const t = {
      size: Math.round(range(rng, 16, 34)),
      atmosphere, life,
      lifeText: pick(rng, LIFE_FLAVOR[life]),
      hasRings: rng() < 0.04,
      hue, accent: (hue + Math.floor(range(rng, 20, 60))) % 360
    };
    const palette = palettePick(id, 'moon');
    const hues = paletteHues(palette);
    t.palette = palette; t.hue = hues[0]; t.accent = hues[1];
    return t;
  }
  function starTraits(id){
    const rng = seededRng('star:' + id);
    const type = weightedPick(rng, [
      ['red dwarf',24],['yellow star',24],['blue giant',12],['white dwarf',10],
      ['binary stars',7],['violet giant',12],['neutron star',11]
    ]);
    const styleRng = seededRng('starstyle:' + id);
    const style = weightedPick(styleRng, [
      ['plain',14],['speckled',12],['marbled',14],['cat-eye',10],['neon',14],['silver',8],['prism',16],['tie-dye',12]
    ]);
    const base = STAR_TYPES[type];
    const accentHue = (base.hue + Math.floor(range(styleRng, 40, 140))) % 360;
    // Palette is rotated so the colour closest to the star type's classic hue
    // leads (a red dwarf still burns reddish at its core), with the rest of
    // the palette doing the psychedelic work around it.
    let palette = palettePick(id, 'star');
    let lead = 0, best = 999;
    palette.forEach((c, i) => {
      const d = hueDist(hexToHsl(c)[0], base.hue);
      if(d < best){ best = d; lead = i; }
    });
    palette = palette.slice(lead).concat(palette.slice(0, lead));
    const hues = paletteHues(palette);
    const srng = seededRng('starspin:' + id);
    return Object.assign({type, style, accentHue: hues[1], palette, spinDur: 18 + Math.floor(srng() * 30), spinPhase: srng()}, base, {hue: hues[0]});
  }
  function galaxyTraits(id){
    const rng = seededRng('galaxy:' + id);
    return {
      shape: pick(rng, ['spiral','elliptical','irregular']),
      nebulaHue: Math.floor(range(rng, 0, 360)),
      starDensity: pick(rng, ['sparse','moderate','dense'])
    };
  }
  function orbitParams(id){
    const rng = seededRng('orbit:' + id);
    return {
      angle: Math.floor(range(rng, 0, 360)),
      duration: Math.round(range(rng, 42, 92)),
      direction: rng() < 0.5 ? 1 : -1
    };
  }
  function starmapPos(id){
    const rng = seededRng('pos:' + id);
    return { x: range(rng, 10, 90), y: range(rng, 10, 90) };
  }

  /* =========================================================
     Data loading (lazy — only fetches what's on screen)
     ========================================================= */
  async function loadGalaxy(){
    const rootChildren = await driveListChildren(CONFIG.GALAXY_FOLDER_ID);
    const readmeFile = findReadme(rootChildren);
    const readme = readmeFile ? await driveFetchText(readmeFile.id) : '';
    const feelingsFile = rootChildren.find(f => /^feelings(\.txt)?$/i.test((f.name || '').trim()));
    const captainFile = rootChildren.find(f => /^captain(\.txt)?$/i.test((f.name || '').trim()));
    const poetryFile = rootChildren.find(f => /^poetry(\.txt)?$/i.test((f.name || '').trim()));
    const captainMessage = captainFile ? await driveFetchText(captainFile.id) : '';
    const systems = rootChildren.filter(isFolder).map(f => ({
      id: f.id, name: f.name, createdTime: f.createdTime,
      planetsLoaded: false, planets: [], readme: null, readmeFileId: null,
      traits: null
    }));
    return {
      name: CONFIG.GALAXY_NAME, readme,
      captainMessage,
      feelingsFileId: feelingsFile ? feelingsFile.id : null,
      poetryFileId: poetryFile ? poetryFile.id : null,
      traits: galaxyTraits(CONFIG.GALAXY_FOLDER_ID),
      systems
    };
  }

  function isFeaturedMarker(f){ return /^featured(\.txt)?$/i.test((f.name || '').trim()); }

  async function loadSystem(system){
    if(system.planetsLoaded) return system;
    const children = await driveListChildren(system.id);
    const readmeFile = findReadme(children);
    system.readmeFileId = readmeFile ? readmeFile.id : null;
    const planetFolders = children.filter(isFolder);
    const planets = [];

    // Manual planets: a folder per mix, with its own readme.txt and
    // optionally moon subfolders. Full control, more folder upkeep.
    // Dropping a "featured.txt" in the folder flags it as featured.
    for(const pf of planetFolders){
      const pchildren = await driveListChildren(pf.id);
      const audioFile = pchildren.find(isAudio);
      if(!audioFile) continue;
      const preadme = findReadme(pchildren);
      const isFeatured = pchildren.some(isFeaturedMarker);
      const moons = pchildren.filter(isFolder).map(mf => ({
        id: mf.id, name: stripExt(mf.name), createdTime: mf.createdTime,
        loaded: false, audioFileId: null, readmeFileId: null, readme: null, traits: null
      }));
      planets.push({
        id: pf.id, name: stripExt(pf.name), createdTime: pf.createdTime,
        audioFileId: audioFile.id,
        readmeFileId: preadme ? preadme.id : null, readme: null,
        moons, traits: planetTraits(pf.id),
        isNewFlag: isNew(pf.createdTime) || moons.some(m => isNew(m.createdTime)),
        isFeatured
      });
    }

    // Auto planets: bare audio files sitting directly in the solar system
    // folder. No folder or readme needed — the site invents the name,
    // description, and traits, seeded from the file's own ID so the
    // result is permanent. These can't have moons (a file can't contain
    // subfolders), so use a manual folder instead for any mix that needs one.
    // To feature one, drop a sibling "<same-name>.featured.txt" next to it
    // (e.g. mix002.mp3 + mix002.featured.txt).
    const featuredBases = new Set(
      children.filter(f => /\.featured\.txt$/i.test(f.name))
        .map(f => f.name.replace(/\.featured\.txt$/i, '').toLowerCase())
    );
    children.filter(isAudio).forEach(af => {
      const traits = planetTraits(af.id);
      planets.push({
        id: af.id, name: autoPlanetName(af.id), createdTime: af.createdTime,
        audioFileId: af.id,
        readmeFileId: null, readme: autoPlanetReadme(traits),
        moons: [], traits,
        isNewFlag: isNew(af.createdTime),
        isFeatured: featuredBases.has(stripExt(af.name).toLowerCase()),
        auto: true
      });
    });

    system.planets = planets;
    system.planetsLoaded = true;
    system.traits = starTraits(system.id);
    return system;
  }

  async function loadMoon(moon){
    if(moon.loaded) return moon;
    const children = await driveListChildren(moon.id);
    const audioFile = children.find(isAudio);
    const mreadme = findReadme(children);
    moon.audioFileId = audioFile ? audioFile.id : null;
    moon.readmeFileId = mreadme ? mreadme.id : null;
    moon.isFeatured = children.some(isFeaturedMarker);
    moon.traits = moonTraits(moon.id);
    moon.isNewFlag = isNew(moon.createdTime);
    moon.loaded = true;
    return moon;
  }

  async function ensureReadme(obj){
    if(obj.readme != null) return obj.readme;
    obj.readme = obj.readmeFileId ? await driveFetchText(obj.readmeFileId) : '';
    return obj.readme;
  }

  function renderStarfield(){
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    const reduceMotion = !motionEnabled();
    if(reduceMotion){
      console.info('Galaxy FM: motion is disabled (browser/OS "prefers-reduced-motion", or check CONFIG.FORCE_MOTION).');
    }
    const STAR_COUNT = 420;
    const SPEED = 1.8;
    const FOCAL = 300;
    let W, H, cx, cy, stars = [];

    function resetStar(s){
      s.x = (Math.random() * 2 - 1) * W;
      s.y = (Math.random() * 2 - 1) * H;
      s.z = W * (0.6 + Math.random() * 0.4);
    }
    function buildStars(){
      stars = [];
      for(let i = 0; i < STAR_COUNT; i++){
        const s = {x: 0, y: 0, z: 0};
        resetStar(s);
        s.z = Math.random() * W; // stagger initial depth so stars don't all reset in unison
        stars.push(s);
      }
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W / 2; cy = H / 2;
      buildStars();
    }
    function drawStatic(){
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      stars.forEach(s => {
        const k = FOCAL / s.z;
        const px = s.x * k + cx, py = s.y * k + cy;
        if(px < 0 || px > W || py < 0 || py > H) return;
        ctx.beginPath();
        ctx.arc(px, py, 1, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    function frame(){
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      for(const s of stars){
        const oldZ = s.z + SPEED;
        const k = FOCAL / s.z, k0 = FOCAL / oldZ;
        const px = s.x * k + cx, py = s.y * k + cy;
        const px0 = s.x * k0 + cx, py0 = s.y * k0 + cy;
        const proximity = 1 - s.z / W;
        const alpha = Math.min(1, 0.12 + proximity * 0.9);
        ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.lineWidth = Math.max(0.6, proximity * 2.6);
        ctx.beginPath();
        ctx.moveTo(px0, py0);
        ctx.lineTo(px, py);
        ctx.stroke();
        s.z -= SPEED;
        if(s.z <= 1 || px < -60 || px > W + 60 || py < -60 || py > H + 60){
          resetStar(s);
        }
      }
      requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    if(reduceMotion){
      drawStatic();
    } else {
      requestAnimationFrame(frame);
    }
  }

  /* Same "warp toward camera" starfield as the homepage, but bigger/faster
     stars and centered on the reactor core instead of the viewport. */
  let stopEngineStarfield = null;
  function startEngineStarfield(){
    if(stopEngineStarfield) return; // already running
    const canvas = document.getElementById('engine-starfield');
    const ctx = canvas.getContext('2d');
    const reduceMotion = !motionEnabled();
    const STAR_COUNT = 420;
    const SPEED = 2.6;
    const FOCAL = 300;
    let W, H, cx, cy, stars = [], rafId = null;

    function resetStar(s){
      s.x = (Math.random() * 2 - 1) * W;
      s.y = (Math.random() * 2 - 1) * H;
      s.z = 1 + Math.random() * 3; // reappear close, then recede
    }
    function buildStars(){
      stars = [];
      for(let i = 0; i < STAR_COUNT; i++){
        const s = {x: 0, y: 0, z: 0};
        s.x = (Math.random() * 2 - 1) * W;
        s.y = (Math.random() * 2 - 1) * H;
        s.z = 1 + Math.random() * (W - 1); // staggered distances so it doesn't start in a single wave
        stars.push(s);
      }
    }
    function updateCenter(){
      const core = document.getElementById('reactor-core');
      if(core){
        const r = core.getBoundingClientRect();
        cx = r.left + r.width / 2;
        cy = r.top + r.height / 2;
      } else {
        cx = W / 2; cy = H / 2;
      }
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      updateCenter();
      buildStars();
    }
    function drawStatic(){
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      stars.forEach(s => {
        const k = FOCAL / s.z;
        const px = s.x * k + cx, py = s.y * k + cy;
        if(px < 0 || px > W || py < 0 || py > H) return;
        ctx.beginPath();
        ctx.arc(px, py, 1.6, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    function frame(){
      updateCenter();
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      for(const s of stars){
        const oldZ = Math.max(1, s.z - SPEED); // previous (nearer) position, for the trail
        const k = FOCAL / s.z, k0 = FOCAL / oldZ;
        const px = s.x * k + cx, py = s.y * k + cy;
        const px0 = s.x * k0 + cx, py0 = s.y * k0 + cy;
        const proximity = 1 - Math.min(1, s.z / W);
        const alpha = Math.min(1, 0.14 + proximity * 0.9);
        ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.lineWidth = Math.max(1, proximity * 4);
        ctx.beginPath();
        ctx.moveTo(px0, py0);
        ctx.lineTo(px, py);
        ctx.stroke();
        s.z += SPEED; // receding into the distance, toward the vanishing point
        if(s.z >= W){
          resetStar(s);
        }
      }
      rafId = requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    if(reduceMotion) drawStatic();
    else rafId = requestAnimationFrame(frame);

    stopEngineStarfield = function(){
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stopEngineStarfield = null;
    };
  }

  /* Right-to-left hypnotic parallax streak, used only behind the Captain's
     Log scene (started when it opens, stopped when it closes). */
  let stopLogStarfield = null;
  function startLogStarfield(){
    if(stopLogStarfield) return; // already running
    const canvas = document.getElementById('log-starfield');
    const ctx = canvas.getContext('2d');
    const reduceMotion = !motionEnabled();
    const LAYERS = [
      { count: 130, speed: 1.1, size: 1,   alpha: 0.32 },
      { count: 80,  speed: 2.4, size: 1.6, alpha: 0.6  },
      { count: 40,  speed: 4.8, size: 2.2, alpha: 0.95 }
    ];
    let W, H, stars = [], frameCount = 0, rafId = null;

    function buildStars(){
      stars = [];
      LAYERS.forEach(layer => {
        for(let i = 0; i < layer.count; i++){
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            speed: layer.speed * (0.85 + Math.random() * 0.3),
            size: layer.size,
            alpha: layer.alpha * (0.7 + Math.random() * 0.3),
            phase: Math.random() * Math.PI * 2
          });
        }
      });
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      buildStars();
    }
    function drawStatic(){
      ctx.clearRect(0, 0, W, H);
      stars.forEach(s => {
        ctx.fillStyle = 'rgba(255,255,255,' + s.alpha + ')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    function frame(){
      frameCount++;
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      for(const s of stars){
        const trail = s.speed * 2.4;
        const wobble = Math.sin(frameCount * 0.02 + s.phase) * 1.6;
        const y = s.y + wobble;
        ctx.strokeStyle = 'rgba(255,255,255,' + s.alpha + ')';
        ctx.lineWidth = s.size;
        ctx.beginPath();
        ctx.moveTo(s.x + trail, y);
        ctx.lineTo(s.x, y);
        ctx.stroke();
        s.x -= s.speed;
        if(s.x < -trail - 4){
          s.x = W + Math.random() * 60;
          s.y = Math.random() * H;
        }
      }
      rafId = requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    if(reduceMotion) drawStatic();
    else rafId = requestAnimationFrame(frame);

    stopLogStarfield = function(){
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stopLogStarfield = null;
    };
  }

  /* Slow, dim starfield behind the Bridge — kept quiet so it doesn't
     compete with the poetry text for attention, but bigger and a bit
     brighter than a typical ambient field for a more psychedelic feel.
     Tints to the current poem's hue, and supports a temporary "warp
     burst" (stars converge and streak outward from center at high
     speed, cycling through a 5-color wave) for jumping to a new poem. */
  let stopBridgeStarfield = null;
  let bridgeWarpBurst = null;
  let bridgeSetStarHue = null;
  function startBridgeStarfield(){
    if(stopBridgeStarfield) return;
    const canvas = document.getElementById('bridge-starfield');
    const ctx = canvas.getContext('2d');
    const reduceMotion = !motionEnabled();
    const LAYERS = [
      { count: 85, speed: 0.28, size: 1.8, alpha: 0.28 },
      { count: 50, speed: 0.55, size: 2.6, alpha: 0.42 },
      { count: 22, speed: 1.0,  size: 3.4, alpha: 0.6  }
    ];
    let W, H, stars = [], rafId = null;
    let warpUntil = 0, warpStars = [], warpPalette = [];
    let lastWarpBase = null;
    let starHue = 210;

    function buildStars(){
      stars = [];
      LAYERS.forEach(layer => {
        for(let i = 0; i < layer.count; i++){
          stars.push({
            x: Math.random() * W, y: Math.random() * H,
            speed: layer.speed * (0.85 + Math.random() * 0.3),
            size: layer.size, alpha: layer.alpha * (0.7 + Math.random() * 0.3)
          });
        }
      });
    }
    // Picks 5 hues spread around the color wheel from a rotation point.
    // If a specific base hue is given (the arriving poem's color), the
    // whole wave is built from that; otherwise picks a random rotation
    // that's never within 30\u00b0 of the previous warp's.
    function buildWarpPalette(baseHueOverride){
      let base;
      if(typeof baseHueOverride === 'number'){
        base = baseHueOverride;
      }else{
        do{ base = Math.floor(Math.random() * 360); }
        while(lastWarpBase !== null && Math.abs(base - lastWarpBase) < 30);
      }
      lastWarpBase = base;
      warpPalette = [0, 72, 144, 216, 288].map(offset =>
        (base + offset + (Math.random() * 20 - 10) + 360) % 360
      );
    }
    function buildWarpStars(baseHueOverride){
      warpStars = [];
      buildWarpPalette(baseHueOverride);
      const cx = W / 2, cy = H / 2;
      for(let i = 0; i < 140; i++){
        const angle = Math.random() * Math.PI * 2;
        warpStars.push({
          angle, dist: Math.random() * 40,
          speed: 9 + Math.random() * 10,
          size: 1.4 + Math.random() * 2.2,
          alpha: 0.55 + Math.random() * 0.45,
          cx, cy
        });
      }
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      buildStars();
    }
    function draw(){
      ctx.clearRect(0, 0, W, H);
      stars.forEach(s => {
        ctx.fillStyle = 'hsla(' + starHue + ',85%,72%,' + s.alpha + ')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    function drawWarp(intensity){
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      const maxDist = Math.hypot(W, H) / 2 + 60;
      const BAND = 70; // width of each color wave, in px of travel distance
      warpStars.forEach(s => {
        const x = s.cx + Math.cos(s.angle) * s.dist;
        const y = s.cy + Math.sin(s.angle) * s.dist;
        const trail = s.speed * 3.2 * intensity;
        const tx = s.cx + Math.cos(s.angle) * (s.dist + trail);
        const ty = s.cy + Math.sin(s.angle) * (s.dist + trail);
        const band = Math.floor(s.dist / BAND) % warpPalette.length;
        const hue = warpPalette[band];
        ctx.strokeStyle = 'hsla(' + hue + ',85%,65%,' + (s.alpha * intensity) + ')';
        ctx.lineWidth = s.size;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(tx, ty);
        ctx.stroke();
        s.dist += s.speed * intensity;
        if(s.dist > maxDist){
          s.dist = Math.random() * 40;
          s.angle = Math.random() * Math.PI * 2;
        }
      });
    }
    function frame(){
      const now = performance.now();
      if(now < warpUntil){
        const remaining = warpUntil - now;
        // ramp in fast, hold, then ease out over the last 300ms
        const intensity = remaining < 300 ? remaining / 300 : 1;
        drawWarp(Math.max(intensity, 0.08));
      }else{
        for(const s of stars){
          s.x -= s.speed;
          if(s.x < -4){ s.x = W + Math.random() * 40; s.y = Math.random() * H; }
        }
        draw();
      }
      rafId = requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    if(reduceMotion) draw();
    else rafId = requestAnimationFrame(frame);

    bridgeSetStarHue = function(hue){ starHue = hue; };

    bridgeWarpBurst = function(durationMs, baseHue){
      if(reduceMotion) return;
      buildWarpStars(baseHue);
      warpUntil = performance.now() + durationMs;
    };

    stopBridgeStarfield = function(){
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bridgeWarpBurst = null;
      bridgeSetStarHue = null;
      stopBridgeStarfield = null;
    };
  }

  /* Slow, quiet ambient starfield behind the Comms Room — just a plain
     drifting backdrop for the broadcast tower, no per-poem theming needed. */
  let stopCommsStarfield = null;
  function startCommsStarfield(){

    const ctx = canvas.getContext('2d');
    const reduceMotion = !motionEnabled();
    const STAR_COUNT = 160;
    const SPEED = 0.4;
    let W, H, stars = [], rafId = null;

    function buildStars(){
      stars = [];
      for(let i = 0; i < STAR_COUNT; i++){
        stars.push({
          x: Math.random() * W, y: Math.random() * H,
          size: 1 + Math.random() * 1.8, alpha: 0.22 + Math.random() * 0.5
        });
      }
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      buildStars();
    }
    function draw(){

  /* Floating "feelings" words for the Captain's Log scene, pulled from
     feelings.txt in the root Galaxy folder — one word per line. Each gets
     a random gentle drift and a slow color-breathe via hue-rotate. */
  let stopFeelingsBounce = null;
  async function renderLogFeelings(){
    const layer = $('#log-feelings-layer');
    layer.innerHTML = '';
    if(stopFeelingsBounce) stopFeelingsBounce();

    let words = [];
    try{
      if(state.galaxy.demo){
        words = ['wonder', 'joy', 'drift', 'glow', 'calm', 'home'];
      } else if(state.galaxy.feelingsFileId){
        const txt = await driveFetchText(state.galaxy.feelingsFileId);
        words = txt.split('\n').map(w => w.trim()).filter(Boolean);
      }
    }catch(e){ words = []; }
    if(!words.length) return;

    const animate = motionEnabled();
    const SPEED = 2;
    const tickerEl = document.getElementById('log-ticker');
    const tickerReserve = tickerEl ? tickerEl.offsetHeight : 90; // keep clear of the bottom ticker
    let bodies = [];

    // Builds one new trio of words, each pinned to its own fixed height and
    // moving only left/right — they never touch the top or bottom edges.
    function spawnTrio(){
      layer.innerHTML = '';
      const picked = words.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(3, words.length));
      const els = picked.map(word => {
        const el = document.createElement('span');
        el.className = 'feeling-word';
        el.style.setProperty('--hue', Math.floor(Math.random() * 360));
        if(animate){
          const colorDur = (7 + Math.random() * 8).toFixed(1);
          const colorDelay = (-Math.random() * colorDur).toFixed(1);
          el.style.animation = 'feeling-hue ' + colorDur + 's linear ' + colorDelay + 's infinite';
        }
        el.textContent = word;
        layer.appendChild(el);
        return el;
      });

      if(!animate){
        els.forEach(el => {
          el.style.transform = 'translate(' + (10 + Math.random() * 70) + '%,' + (10 + Math.random() * 70) + '%)';
        });
        return [];
      }

      // Full DVD-logo bounce: moves diagonally, reflects off all four edges.
      // Bottom still respects the ticker reserve so words don't overlap it.
      return els.map(el => {
        const w = el.offsetWidth, h = el.offsetHeight;
        const maxY = window.innerHeight - tickerReserve - h;
        const angle = Math.random() * Math.PI * 2;
        return {
          el, w, h,
          x: Math.random() * Math.max(1, window.innerWidth - w),
          y: Math.random() * Math.max(1, maxY),
          vx: Math.cos(angle) * SPEED,
          vy: Math.sin(angle) * SPEED
        };
      });
    }

    bodies = spawnTrio();

    let rafId = null;
    function step(){
      const maxY = window.innerHeight - tickerReserve;
      bodies.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
        if(b.x <= 0){ b.x = 0; b.vx = Math.abs(b.vx); }
        else if(b.x + b.w >= window.innerWidth){ b.x = window.innerWidth - b.w; b.vx = -Math.abs(b.vx); }
        if(b.y <= 0){ b.y = 0; b.vy = Math.abs(b.vy); }
        else if(b.y + b.h >= maxY){ b.y = maxY - b.h; b.vy = -Math.abs(b.vy); }
        b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
      });
      rafId = requestAnimationFrame(step);
    }
    if(animate) rafId = requestAnimationFrame(step);

    const intervalId = setInterval(() => { bodies = spawnTrio(); }, 15000);

    stopFeelingsBounce = function(){
      if(rafId) cancelAnimationFrame(rafId);
      clearInterval(intervalId);
      stopFeelingsBounce = null;
    };
  }

  function atmosOpacity(strength){
    return strength === 0 ? 0 : strength === 1 ? 0.18 : 0.34;
  }

  function planetVisualHTML(traits, opts){
    opts = opts || {};
    const lifeClass = traits.life !== 'barren' ? ' life-' + traits.life : '';
    const ringHTML = traits.hasRings ? '<span class="ring"></span>' : '';
    return (
      '<span class="planet-body ' + traits.surface.cls + lifeClass + '" ' +
      'style="--hue:' + traits.hue + '; --accent:' + traits.accent + ';' + paletteStyle(traits.palette) +
      '--spin-dur:' + traits.spinDur + 's;--spin-delay:-' + Math.round(traits.spinDur * traits.spinPhase) + 's;">' +
      '<span class="atmos-glow" style="--atmos-o:' + atmosOpacity(traits.atmosphere.strength) + '"></span>' +
      ringHTML +
      '</span>'
    );
  }

  /* ---- galaxy view ---- */

  /* ---- system / orbit view ---- */
  async function enterSystem(sys){
    state.currentSystem = sys;
    $('#view-galaxy').classList.add('hidden');
    $('#view-system').classList.remove('hidden');
    $('#crumb-sep').classList.remove('hidden');
    $('#crumb-system').classList.remove('hidden');
    $('#crumb-system').textContent = sys.name;
    $('#crumb-galaxy').classList.remove('current');
    $('#system-title').textContent = sys.name;
    $('#system-readme').textContent = '';
    $('#orbit-field').innerHTML = '<p style="text-align:center;color:var(--text-dim);font-size:12px;">Tuning in\u2026</p>';

    try{
      await loadSystem(sys);
    }catch(e){
      $('#orbit-field').innerHTML = '<p style="text-align:center;color:var(--text-dim);font-size:12px;">Couldn\u2019t reach this solar system. Check your connection or Drive sharing settings.</p>';
      return;
    }
    const st = sys.traits || starTraits(sys.id);
    const sunEl = document.getElementById('system-sun');
    sunEl.className = 'sun star-' + st.style;
    sunEl.style.setProperty('--hue', st.hue);
    sunEl.style.setProperty('--accent2', st.accentHue);
    st.palette.forEach((c, i) => sunEl.style.setProperty('--c' + (i + 1), c));
    sunEl.style.setProperty('--spin-dur', st.spinDur + 's');
    sunEl.style.setProperty('--spin-delay', '-' + Math.round(st.spinDur * st.spinPhase) + 's');
    $('#system-sub').textContent = st.type + ' \u00b7 ' + sys.planets.length + ' planet' + (sys.planets.length === 1 ? '' : 's');
    ensureReadme(sys).then(txt => { $('#system-readme').textContent = txt || ''; });

    renderOrbitField(sys);
  }

  function renderOrbitField(sys){
    const field = $('#orbit-field');
    field.innerHTML = '';
    if(!sys.planets.length){
      field.innerHTML = '<p style="text-align:center;color:var(--text-dim);font-size:12px;">No planets discovered here yet.</p>';
      return;
    }
    const isSmall = window.innerWidth < 640;
    const baseRadius = isSmall ? 46 : 70;
    const ringGap = isSmall ? 34 : 52;

    sys.planets.forEach((planet, i) => {
      const radius = baseRadius + i * ringGap;
      const ring = document.createElement('div');
      ring.className = 'orbit-ring';
      ring.style.width = (radius * 2) + 'px';
      ring.style.height = (radius * 2) + 'px';
      field.appendChild(ring);

      const op = orbitParams(planet.id);
      const dir = op.direction === 1 ? 'normal' : 'reverse';
      const counterDir = op.direction === 1 ? 'reverse' : 'normal';
      // Negative delay starts the loop partway through, so planets don't all
      // line up at the same angle when the page loads. Same delay on both
      // elements keeps the counter-rotation in sync throughout.
      const startDelay = -((op.angle / 360) * op.duration) + 's';

      const rotator = document.createElement('div');
      rotator.className = 'orbit-rotator';
      rotator.style.animation = 'spin ' + op.duration + 's linear infinite';
      rotator.style.animationDirection = dir;
      rotator.style.animationDelay = startDelay;

      const slot = document.createElement('div');
      slot.className = 'planet-slot' + (planet.isNewFlag ? ' is-new' : '');
      slot.style.left = radius + 'px';
      slot.style.animation = 'spin ' + op.duration + 's linear infinite';
      slot.style.animationDirection = counterDir;
      slot.style.animationDelay = startDelay;

      const btn = document.createElement('button');
      btn.className = 'planet-btn ' + planet.traits.surface.cls;
      btn.style.setProperty('--size', planet.traits.size + 'px');
      btn.style.setProperty('--hue', planet.traits.hue);
      btn.style.setProperty('--accent', planet.traits.accent);
      btn.setAttribute('aria-label', planet.name);
      btn.innerHTML = planetVisualHTML(planet.traits);
      btn.addEventListener('click', () => openPlanetDetail(planet));

      const label = document.createElement('span');
      label.className = 'planet-label';
      label.textContent = planet.name;

      const wrap = document.createElement('div');
      wrap.style.position = 'relative';
      wrap.appendChild(btn);
      wrap.appendChild(label);

      slot.appendChild(wrap);
      rotator.appendChild(slot);
      field.appendChild(rotator);
    });
  }

  /* Shared orbit keyframes, injected once. Both the outer rotator and the
     inner planet-slot animate with this same rotate sweep — the slot's
     animation-direction is set to the opposite of its parent's in JS below,
     which is what cancels out the rotation and keeps the planet upright. */
  const orbitKeyframes = document.createElement('style');
  orbitKeyframes.textContent = '@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}';
  document.head.appendChild(orbitKeyframes);

  /* ---- persistent playback (survives closing the panel / browsing away) ---- */
  const globalAudio = document.getElementById('global-audio');
  const seekEl = document.getElementById('mp-seek');
  let currentTrack = { id: null, title: '', context: '' };
  let isSeeking = false;

  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }
  function resetSeekUI(){
    seekEl.min = 0; seekEl.max = 0; seekEl.value = 0;
    $('#mp-time').textContent = '0:00 / 0:00';
  }
  function updateSeekUI(){
    if(isSeeking) return;
    const duration = globalAudio.duration;
    if(isFinite(duration) && duration > 0){
      seekEl.max = duration;
      seekEl.value = globalAudio.currentTime;
    }
    $('#mp-time').textContent = formatTime(globalAudio.currentTime) + ' / ' + formatTime(globalAudio.duration);
  }

  function playPauseLabelFor(fileId){
    return (currentTrack.id === fileId && !globalAudio.paused) ? '\u275A\u275A Pause' : '\u25B6 Play this mix';
  }
  function playTrack(fileId, title, context, fromComms){
    if(!fileId) return;
    if(!fromComms && commsOnAir) turnOffComms();
    if(currentTrack.id !== fileId){
      globalAudio.src = driveStreamUrl(fileId);
      currentTrack = { id: fileId, title, context };
      $('#mp-title').textContent = title;
      $('#mp-context').textContent = context;
      resetSeekUI();
    }
    globalAudio.play();
    $('#mini-player').classList.remove('hidden');
    document.body.classList.add('has-mini-player');
  }
  function togglePlayPause(){
    if(globalAudio.paused) globalAudio.play(); else globalAudio.pause();
  }
  function stopAndHideMiniPlayer(){
    if(commsOnAir) turnOffComms();
    globalAudio.pause();
    globalAudio.removeAttribute('src');
    globalAudio.load();
    currentTrack = { id: null, title: '', context: '' };
    resetSeekUI();
    $('#mini-player').classList.add('hidden');
    document.body.classList.remove('has-mini-player');
  }
  function syncPlaybackUI(){
    $('#mp-playpause').textContent = globalAudio.paused ? '\u25B6' : '\u275A\u275A';
    $('#mp-playpause').setAttribute('aria-label', globalAudio.paused ? 'Play' : 'Pause');
    const btn = document.getElementById('detail-play-btn');
    if(btn) btn.textContent = playPauseLabelFor(btn.dataset.fileId);
    const reactor = document.getElementById('reactor-core');
    if(reactor) reactor.classList.toggle('running', !globalAudio.paused);
  }
  globalAudio.addEventListener('play', syncPlaybackUI);
  globalAudio.addEventListener('pause', syncPlaybackUI);
  globalAudio.addEventListener('loadedmetadata', updateSeekUI);
  globalAudio.addEventListener('timeupdate', updateSeekUI);
  globalAudio.addEventListener('ended', () => { if(commsOnAir) playNextCommsTrack(); });
  seekEl.addEventListener('pointerdown', () => { isSeeking = true; });
  seekEl.addEventListener('input', () => {
    $('#mp-time').textContent = formatTime(seekEl.value) + ' / ' + formatTime(globalAudio.duration);
  });
  seekEl.addEventListener('change', () => {
    globalAudio.currentTime = seekEl.value;
    isSeeking = false;
  });

  async function pullThrottle(){
    const lever = $('#throttle-lever');
    lever.classList.add('pulled');
    setTimeout(() => lever.classList.remove('pulled'), 220);

    if(motionEnabled()){
      $('#engine-overlay').classList.add('shake');

    setTimeout(() => reactor.classList.remove('redline'), 900);

    const readout = $('#engine-readout');
    readout.textContent = 'Charting a random course\u2026';
    readout.classList.remove('lit');

    try{
      const systems = state.galaxy.systems.slice().sort(() => Math.random() - 0.5);
      for(const sys of systems){
        try{
          await loadSystem(sys);
        }catch(e){ continue; }
        const playable = sys.planets.filter(p => p.audioFileId);
        if(!playable.length) continue;
        const planet = playable[Math.floor(Math.random() * playable.length)];
        playTrack(planet.audioFileId, planet.name, sys.name);
        readout.textContent = 'Now igniting: ' + planet.name + ' \u2014 ' + sys.name;
        readout.classList.add('lit');
        return;

  /* ---- comms room (all-mixes radio) ---- */
  let commsOnAir = false;
  let commsQueue = [];
  let commsIndex = -1;

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  async function buildCommsQueue(){
    const entries = [];
    for(const sys of state.galaxy.systems){
      try{ await loadSystem(sys); }catch(e){ continue; }
      sys.planets.forEach(p => {
        if(p.audioFileId) entries.push({ system: sys, planet: p });
      });
    }
    commsQueue = shuffle(entries);
    commsIndex = -1;
  }

  function updateCommsOnAirUI(isLive){
    $('#comms-onair').classList.toggle('hidden', !isLive);
    $('#comms-tower').classList.toggle('live', isLive);
    $('#comms-toggle-btn').textContent = isLive ? 'Stop broadcast' : 'Go on air';
    $('#comms-toggle-btn').classList.toggle('live', isLive);
    $('#comms-skip-btn').classList.toggle('hidden', !isLive);
  }
  function updateCommsNowPlaying(entry){
    $('#comms-track-name').textContent = entry ? entry.planet.name : '';
    $('#comms-track-context').textContent = entry ? entry.system.name : '';
  }
  function refreshCommsUIFromState(){
    updateCommsOnAirUI(commsOnAir);
    updateCommsNowPlaying(commsOnAir ? commsQueue[commsIndex] : null);
  }

  async function playNextCommsTrack(){
    if(!commsQueue.length) await buildCommsQueue();
    if(!commsQueue.length){
      updateCommsNowPlaying(null);
      $('#comms-track-name').textContent = 'No mixes found to broadcast yet.';
      return;
    }
    commsIndex++;
    if(commsIndex >= commsQueue.length){
      const last = commsQueue[commsQueue.length - 1];
      shuffle(commsQueue);
      if(commsQueue.length > 1 && commsQueue[0] === last){
        [commsQueue[0], commsQueue[1]] = [commsQueue[1], commsQueue[0]];
      }
      commsIndex = 0;
    }
    const entry = commsQueue[commsIndex];
    playTrack(entry.planet.audioFileId, entry.planet.name, entry.system.name, true);
    updateCommsNowPlaying(entry);
  }

  /* ---- cargo bay (drift room) ---- */
  let stopCargoDrift = null;
  function startCargoDrift(){
    if(stopCargoDrift) return;
    const canvas = document.getElementById('cargo-canvas');
    const ctx = canvas.getContext('2d');
    const reduceMotion = !motionEnabled();
    const N = 260;
    let W, H, stars = [], rafId = null, hue = 220;
    let ufoTimer = 200 + Math.random() * 300;
    let ufoHue = Math.random() * 360;

    function resetStar(s){
      s.a = Math.random() * Math.PI * 2;
      s.r = Math.random() * 30 + 5;
      s.speed = Math.random() * 0.6 + 0.3;
      s.size = Math.random() * 1.6 + 0.6;
      s.ufo = false;
    }
    function buildStars(){
      stars = [];
      for(let i = 0; i < N; i++){
        const s = {};
        resetStar(s);
        s.r = Math.random() * Math.max(W, H);
        stars.push(s);
      }
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      buildStars();
    }
    function drawFrame(){
      const cx = W / 2, cy = H / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(0, 0, W, H);

      hue = (hue + 0.06) % 360;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
      grad.addColorStop(0, 'hsla(' + hue + ',60%,18%,0.15)');
      grad.addColorStop(1, 'hsla(' + ((hue + 80) % 360) + ',60%,8%,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ufoTimer--;
      if(ufoTimer <= 0){
        const candidate = stars[Math.floor(Math.random() * stars.length)];
        if(!candidate.ufo){
          candidate.ufo = true;
          ufoHue = Math.random() * 360;
        }
        ufoTimer = 250 + Math.random() * 350;
      }

      const maxR = Math.max(W, H) * 0.75;
      for(const s of stars){
        s.r += s.speed;
        if(s.r > maxR){ resetStar(s); s.r = 5; }
        const x = cx + Math.cos(s.a) * s.r;
        const y = cy + Math.sin(s.a) * s.r;
        const alpha = Math.min(1, s.r / maxR * 2);
        const sz = s.size * (0.5 + s.r / maxR * 1.5);
        if(s.ufo){
          const pulse = 1 + 0.3 * Math.sin(s.r * 0.15);
          ctx.beginPath();
          ctx.fillStyle = 'hsla(' + ufoHue + ',90%,70%,' + alpha + ')';
          ctx.arc(x, y, sz * 2.2 * pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.fillStyle = 'hsla(' + ufoHue + ',100%,90%,' + alpha + ')';
          ctx.arc(x, y, sz * 0.9, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.fillStyle = 'hsla(' + ((hue + 200) % 360) + ',80%,85%,' + alpha + ')';
          ctx.arc(x, y, sz, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    function drawStatic(){
      const cx = W / 2, cy = H / 2;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      stars.forEach(s => {
        const x = cx + Math.cos(s.a) * s.r;
        const y = cy + Math.sin(s.a) * s.r;
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath();
        ctx.arc(x, y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    function frame(){
      drawFrame();
      rafId = requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    if(reduceMotion) drawStatic();
    else rafId = requestAnimationFrame(frame);

    stopCargoDrift = function(){
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stopCargoDrift = null;
    };
  }
  function openCargoBay(){
    $('#cargo-overlay').classList.remove('hidden');
    startCargoDrift();
  }
  function closeCargoBay(){

  /* ---- observatory (celestial room) ----
     The gold sun/moon artwork was cut into separate transparent masks (one per
